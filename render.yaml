# Render Blueprint — one-click deploy.
# Docs: https://render.com/docs/blueprint-spec
#
# This provisions a web service (the bot) + a PostgreSQL database.
# The bot runs in webhook mode, exposing /health for Render's health checks.

services:
  - type: web
    name: telegram-group-bot
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build && npm run db:push
    startCommand: node dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_MODE
        value: webhook
      - key: WEBHOOK_DOMAIN
        # Set to your Render service URL, e.g. https://telegram-group-bot.onrender.com
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_IDS
        sync: false
      - key: DEFAULT_LANGUAGE
        value: ar
      - key: DEFAULT_TIMEZONE
        value: Asia/Riyadh
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: telegram-bot-db
          property: connectionString
      # Optional integrations (set in the Render dashboard):
      # - key: WEATHER_API_KEY
      #   sync: false
      # - key: AI_ENABLED
      #   value: "false"
      # - key: AI_API_KEY
      #   sync: false

databases:
  - name: telegram-bot-db
    plan: free
    region: frankfurt
