# Render Blueprint — near one-click deploy for the main bot.
# Docs: https://render.com/docs/blueprint-spec
#
# In Render:  New → Blueprint → pick this repo → Render reads this file and
# pre-configures everything. You only fill the 3 secret values it asks for
# (BOT_TOKEN, OWNER_IDS, DATABASE_URL).
#
# - runtime: docker  → uses the Dockerfile, so ffmpeg + yt-dlp + chromium are
#   installed (يوت / تنزيل / PDF keep working). The node runtime would drop them.
# - BOT_MODE: polling → no public webhook URL needed (simplest).
# - DATABASE_URL is entered by you = your Neon connection string (permanent,
#   free, no card). We do NOT use Render's own DB — its free tier is deleted
#   after 30 days, which would lose your data again.

services:
  - type: web
    name: telegram-group-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    branch: claude/telegram-group-bot-xenp00
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_MODE
        value: polling
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DEFAULT_LANGUAGE
        value: ar
      - key: DEFAULT_TIMEZONE
        value: Asia/Riyadh
      # ---- You fill these 3 in the Render dashboard when prompted ----
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_IDS
        sync: false
      - key: DATABASE_URL          # ← paste your Neon URL (…neon.tech/…?sslmode=require)
        sync: false
      # ---- Optional (leave unset if you don't use them) ----
      # - key: SUPPORT_CONTACT
      #   sync: false
      # - key: BOT_CHANNEL_URL
      #   sync: false
      # - key: YT_COOKIES
      #   sync: false
