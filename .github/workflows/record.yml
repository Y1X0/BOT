name: تسجيل فيديو الدورة

# شغّله يدويًا من تبويب Actions → اختر هذا الـ workflow → Run workflow، وحط رابط
# بث/فيديو اليوتيوب. ينزّله على رَنر GitHub (قرص ~14GB) ثم يرفعه لحسابك على
# تيليجرام (رسائلك المحفوظة افتراضيًا) عبر Pyrogram — حتى 4GB بحساب Premium.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "رابط البث / الفيديو (YouTube)"
        required: true
      quality:
        description: "أقصى دقة: best أو 1080 أو 720 أو 480"
        required: false
        default: "best"
      runner:
        description: "وين يشتغل؟ self-hosted = جهازك (IP منزلي، بدون حظر) | ubuntu-latest = رَنر GitHub (محظور حاليًا)"
        required: false
        default: "self-hosted"
        type: choice
        options:
          - self-hosted
          - ubuntu-latest

jobs:
  record:
    # يُختار وقت التشغيل: رَنرك المنزلي (self-hosted) أو رَنر GitHub (ubuntu-latest).
    runs-on: ${{ github.event.inputs.runner }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: تثبيت deno (JS runtime ليوتيوب)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: التأكد من توفّر Deno بالـ PATH
        run: |
          echo "PATH=$PATH"
          which deno
          deno --version

      - name: تثبيت الأدوات
        run: |
          set -e
          # ffmpeg: ثبّته فقط لو مش موجود (على جهازك المنزلي قد يكون مثبّتًا أصلاً).
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg موجود: $(ffmpeg -version | head -1)"
          elif command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y ffmpeg
          else
            echo "⚠️ ffmpeg غير موجود وما في apt — ثبّته يدويًا على جهاز الرَنر." >&2
            exit 1
          fi
          # venv معزول: ما يلمس بايثون النظام على جهازك، ويتجاوز قيود PEP 668.
          python3 -m venv venv
          ./venv/bin/pip install -U pip
          # yt-dlp بالطريقة الرسمية + مكوّن EJS محليًا (بدون كوكيز/حساب):
          # وجود حزمة yt-dlp-ejs محليًا يغني عن --remote-components نهائيًا.
          ./venv/bin/pip install -U "yt-dlp[default]"
          ./venv/bin/pip install -U yt-dlp-ejs
          ./venv/bin/pip install -U kurigram tgcrypto
          ./venv/bin/yt-dlp --version
          ./venv/bin/pip show yt-dlp-ejs | grep -iE "^Name|^Version"

      - name: تنزيل الفيديو
        env:
          URL: ${{ github.event.inputs.url }}
          QUALITY: ${{ github.event.inputs.quality }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          set -e
          # نفس البيئة التي ستشغّل yt-dlp — تأكد أن Deno هنا أيضًا:
          echo "which deno: $(which deno)"; deno --version
          mkdir -p out
          COOKIES=""
          if [ -n "$YT_COOKIES" ]; then printf '%s' "$YT_COOKIES" > cookies.txt; COOKIES="--cookies cookies.txt"; fi
          if [ "$QUALITY" = "best" ] || [ -z "$QUALITY" ]; then
            FORMAT="bv*+ba/b"
          else
            FORMAT="bv*[height<=$QUALITY]+ba/b[height<=$QUALITY]/b"
          fi
          # -v: مؤقتًا لنرى سطر "JS runtimes: deno-..." في اللوج ونتأكد أن EJS متاح.
          # --js-runtimes deno: نفعّل Deno صراحةً كـ JS runtime.
          # حزمة yt-dlp-ejs مثبّتة محليًا، لذا لا نستخدم --remote-components.
          # جرّب عدة عملاء يوتيوب لتجاوز حظر الـ datacenter بدون كوكيز قدر الإمكان.
          ./venv/bin/yt-dlp -v --live-from-start $COOKIES -f "$FORMAT" \
            --js-runtimes deno \
            --extractor-args "youtube:player_client=tv,mweb,web_safari,default" \
            --merge-output-format mp4 \
            --no-part \
            -o "out/%(title)s [%(id)s].%(ext)s" \
            "$URL"
          echo "--- الملفات ---"; ls -lh out

      - name: رفعه لتيليجرام
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          TARGET: ${{ secrets.TARGET_CHAT }}
        run: ./venv/bin/python recorder/upload.py
