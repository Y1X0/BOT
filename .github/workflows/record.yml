name: تسجيل فيديو الدورة

# شغّله يدويًا من تبويب Actions → اختر هذا الـ workflow → Run workflow، وحط رابط
# بث/فيديو اليوتيوب. ينزّله على رَنر GitHub (قرص ~14GB) ثم يرفعه لحسابك على
# تيليجرام (رسائلك المحفوظة افتراضيًا) عبر Pyrogram — حتى 4GB بحساب Premium.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "رابط البث / الفيديو (YouTube)"
        required: true
      quality:
        description: "أقصى دقة: best أو 1080 أو 720 أو 480"
        required: false
        default: "best"

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: تثبيت deno (JS runtime ليوتيوب)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: التأكد من توفّر Deno بالـ PATH
        run: |
          echo "PATH=$PATH"
          which deno
          deno --version

      - name: تثبيت الأدوات
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          python3 -m pip install --upgrade pip
          # yt-dlp بالطريقة الرسمية + مكوّن EJS محليًا (بدون كوكيز/حساب):
          # وجود حزمة yt-dlp-ejs محليًا يغني عن --remote-components نهائيًا.
          python3 -m pip install -U "yt-dlp[default]"
          python3 -m pip install -U yt-dlp-ejs
          python3 -m pip install -U kurigram tgcrypto
          yt-dlp --version
          python3 -m pip show yt-dlp-ejs | grep -iE "^Name|^Version"

      - name: تنزيل الفيديو
        env:
          URL: ${{ github.event.inputs.url }}
          QUALITY: ${{ github.event.inputs.quality }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          set -e
          # نفس البيئة التي ستشغّل yt-dlp — تأكد أن Deno هنا أيضًا:
          echo "which deno: $(which deno)"; deno --version
          mkdir -p out
          COOKIES=""
          if [ -n "$YT_COOKIES" ]; then printf '%s' "$YT_COOKIES" > cookies.txt; COOKIES="--cookies cookies.txt"; fi
          if [ "$QUALITY" = "best" ] || [ -z "$QUALITY" ]; then
            FORMAT="bv*+ba/b"
          else
            FORMAT="bv*[height<=$QUALITY]+ba/b[height<=$QUALITY]/b"
          fi
          # -v: مؤقتًا لنرى سطر "JS runtimes: deno-..." في اللوج ونتأكد أن EJS متاح.
          # --js-runtimes deno: نفعّل Deno صراحةً كـ JS runtime.
          # حزمة yt-dlp-ejs مثبّتة محليًا، لذا لا نستخدم --remote-components.
          # جرّب عدة عملاء يوتيوب لتجاوز حظر الـ datacenter بدون كوكيز قدر الإمكان.
          yt-dlp -v --live-from-start $COOKIES -f "$FORMAT" \
            --js-runtimes deno \
            --extractor-args "youtube:player_client=tv,mweb,web_safari,default" \
            --merge-output-format mp4 \
            --no-part \
            -o "out/%(title)s [%(id)s].%(ext)s" \
            "$URL"
          echo "--- الملفات ---"; ls -lh out

      - name: رفعه لتيليجرام
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          TARGET: ${{ secrets.TARGET_CHAT }}
        run: python3 recorder/upload.py
