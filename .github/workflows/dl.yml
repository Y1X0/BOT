name: تنزيل (عبر البوت)

# يُطلقه البوت تلقائيًا (workflow_dispatch عبر GitHub API) عند طلب تنزيل.
# يشتغل على رَنر GitHub القوي (2 نواة / 7GB) — فالبوت على Render (0.1 نواة)
# لا يتحمّل الترميز ولا ينهار. الحظر يُحَلّ بـ WARP (نفس طريقة البوت: wgcf +
# wireproxy + عميل android)، بدون كوكيز. التسليم عبر **توكن البوت مباشرة**
# (sendAudio/sendVideo) — بلا جلسة مستخدم وبلا مخاطرة على أي حساب. حدّ الرفع
# 50MB (حد Bot API)، والصوت يُرمَّز مونو 64k ليبقى تحته حتى للحلقات الطويلة.
#
# ملاحظة: TARGET لازم يكون محادثة يقدر البوت يرسل فيها (جروب فيه البوت، أو
# مستخدم بدأ محادثة مع البوت). كلمة "me" لا تصلح مع توكن البوت.
#
# record.yml القديم يبقى كما هو (نقطة رجوع). هذا ملف منفصل تمامًا.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "الرابط"
        required: true
      mode:
        description: "audio أو video"
        required: false
        default: "audio"
      target:
        description: "chat_id الوجهة (محادثتك/جروبك)"
        required: true
      quality:
        description: "أقصى دقة للفيديو (best/1080/720/480)"
        required: false
        default: "720"

concurrency:
  # لا نشغّل أكثر من تنزيل لنفس الوجهة في آنٍ واحد.
  group: dl-${{ github.event.inputs.target }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: تثبيت الأدوات + WARP
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          # wgcf + wireproxy — نفس إصدارات البوت (Dockerfile)
          sudo wget -q https://github.com/ViRb3/wgcf/releases/download/v2.2.29/wgcf_2.2.29_linux_amd64 -O /usr/local/bin/wgcf
          sudo chmod a+rx /usr/local/bin/wgcf
          wget -q https://github.com/whyvl/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz -O /tmp/wireproxy.tgz
          sudo tar xzf /tmp/wireproxy.tgz -C /usr/local/bin wireproxy
          sudo chmod a+rx /usr/local/bin/wireproxy
          # yt-dlp (رسمي) + kurigram/tgcrypto للرفع
          python3 -m venv venv
          ./venv/bin/pip install -U pip
          ./venv/bin/pip install -U "yt-dlp[default]"
          ./venv/bin/yt-dlp --version

      - name: تنزيل عبر WARP (مع تدوير IP عند الحظر)
        env:
          URL: ${{ github.event.inputs.url }}
          MODE: ${{ github.event.inputs.mode }}
          QUALITY: ${{ github.event.inputs.quality }}
        run: |
          set -e
          mkdir -p out
          PROXY="socks5://127.0.0.1:40000"
          CLIENT="youtube:player_client=android,tv,web"

          # Register a WARP account ONCE and build the wireproxy config. Cloudflare
          # rate-limits registration, so the old code (which re-registered on EVERY
          # retry) often got refused → an empty wgcf-profile.conf → wireproxy had no
          # config → the socks port never opened → every yt-dlp attempt died with
          # "Connection refused". Here we retry registration with backoff and VERIFY
          # the profile is non-empty before trusting it, then cache + reuse it.
          register_warp() {
            [ -s wireproxy.conf ] && return 0
            # Short, fixed backoff (reliable AND fast). wgcf register rarely fails;
            # when it does it's a brief hiccup, so a few quick tries beat a long
            # accumulating backoff that made the whole run crawl for minutes.
            for r in 1 2 3; do
              rm -f wgcf-account.toml wgcf-profile.conf
              wgcf register --accept-tos >/dev/null 2>&1 || true
              wgcf generate >/dev/null 2>&1 || true
              if [ -s wgcf-profile.conf ]; then
                { cat wgcf-profile.conf; printf '\n[Socks5]\nBindAddress = 127.0.0.1:40000\n'; } > wireproxy.conf
                echo "WARP profile ready (try $r)"; return 0
              fi
              echo "wgcf register failed (try $r) — retrying"; sleep 3
            done
            echo "wgcf register failed"; return 1
          }

          # (Re)start wireproxy from the cached profile and wait for the socks port.
          # Retries reuse the SAME WARP account (no re-register → no rate-limit); a
          # fresh IP is only forced once, by the loop, when YouTube actually walls it.
          start_warp() {
            register_warp || return 1
            pkill -f wireproxy 2>/dev/null || true
            sleep 1
            nohup wireproxy -c wireproxy.conf >/tmp/wireproxy.log 2>&1 &
            for i in $(seq 1 30); do
              (exec 3<>/dev/tcp/127.0.0.1/40000) >/dev/null 2>&1 && { exec 3>&- ; echo "WARP up"; return 0; }
              sleep 1
            done
            echo "WARP لم يأتِ"; tail -5 /tmp/wireproxy.log 2>/dev/null || true; return 1
          }

          # --socket-timeout fails a stalled connection fast; `timeout` caps the
          # whole attempt so a hung download can never stall the run for minutes.
          dl_once() {
            if [ "$MODE" = "video" ]; then
              case "$QUALITY" in best|"") FMT="bv*+ba/b" ;; *) FMT="bv*[height<=$QUALITY]+ba/b[height<=$QUALITY]/b" ;; esac
              timeout 240 ./venv/bin/yt-dlp --proxy "$PROXY" --extractor-args "$CLIENT" \
                --socket-timeout 20 --retries 2 --fragment-retries 2 \
                -f "$FMT" --merge-output-format mp4 --no-playlist \
                -o "out/%(title)s [%(id)s].%(ext)s" "$URL"
            else
              # صوت مونو 64k: يبقى تحت 50MB حتى ~1.7 ساعة، وواضح للكلام/البودكاست.
              timeout 180 ./venv/bin/yt-dlp --proxy "$PROXY" --extractor-args "$CLIENT" \
                --socket-timeout 20 --retries 2 --fragment-retries 2 \
                -f "ba/ba*" -x --audio-format mp3 --audio-quality 64K \
                --postprocessor-args "ffmpeg:-ac 1" --no-playlist \
                -o "out/%(title)s [%(id)s].%(ext)s" "$URL"
            fi
          }

          ok=0
          for attempt in 1 2 3; do
            # Attempt 2: the first try on this IP failed, so rotate to a FRESH WARP
            # account ONCE (in case YouTube walled this egress IP). We register at
            # most twice — well under Cloudflare's rate limit.
            if [ "$attempt" = "2" ]; then
              echo "تدوير WARP لعنوان جديد"
              rm -f wgcf-account.toml wgcf-profile.conf wireproxy.conf
            fi
            echo "::group::محاولة التنزيل $attempt"
            if start_warp && dl_once; then ok=1; echo "::endgroup::"; break; fi
            echo "::endgroup::"
            echo "محاولة $attempt فشلت — أعيد"
          done
          echo "--- الملفات ---"; ls -lh out || true
          if [ "$ok" != "1" ] || [ -z "$(ls -A out 2>/dev/null)" ]; then
            echo "❌ فشل التنزيل بعد كل المحاولات"; exit 1
          fi

      - name: رفع لتيليجرام (توكن البوت — بلا جلسة/حساب)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TARGET: ${{ github.event.inputs.target }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          set -e
          [ -z "$BOT_TOKEN" ] && { echo "❌ سر BOT_TOKEN مفقود"; exit 1; }
          FILE="$(ls -S out/* 2>/dev/null | head -1)"
          [ -z "$FILE" ] && { echo "❌ لا يوجد ملف"; exit 1; }
          SIZE=$(stat -c%s "$FILE")
          echo "ملف: $(basename "$FILE") ($((SIZE/1024/1024)) MB)"
          API="https://api.telegram.org/bot${BOT_TOKEN}"
          CAP="$(basename "$FILE")"
          # حد Bot API للرفع 50MB. لو أكبر، أبلغ المستخدم بوضوح.
          if [ "$SIZE" -gt 52000000 ]; then
            curl -s "$API/sendMessage" --data-urlencode "chat_id=${TARGET}" \
              --data-urlencode "text=⚠️ الملف (${CAP}) أكبر من حد البوت 50MB. جرّب مقطعًا أقصر." >/dev/null || true
            echo "too large for bot upload"; exit 1
          fi
          if [ "$MODE" = "video" ]; then
            curl -sf -F chat_id="$TARGET" -F supports_streaming=true \
              -F caption="🎬 ${CAP}" -F video=@"$FILE" "$API/sendVideo" >/dev/null
          else
            curl -sf -F chat_id="$TARGET" \
              -F caption="🎵 ${CAP}" -F audio=@"$FILE" "$API/sendAudio" >/dev/null
          fi
          echo "✅ أُرسل إلى ${TARGET}"

      # ضمان ردّ دائم: لو فشل أي شيء (حظر مستمر/خطأ)، أبلغ المستخدم في محادثته
      # عبر توكن البوت — فلا يبقى بلا جواب أبدًا.
      - name: إبلاغ بالفشل
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TARGET: ${{ github.event.inputs.target }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$BOT_TOKEN" ] && exit 0
          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TARGET}" \
            --data-urlencode "text=❌ تعذّر تنزيل هذا الرابط حالياً (محظور مؤقتاً أو الرابط غير صالح). جرّب لاحقاً أو رابطاً آخر." \
            >/dev/null 2>&1 || true
