# Railway / Nixpacks build config.
# Installs a self-contained Chromium (Nix package) so the Smart PDF Creator can
# render HTML → PDF. The "..." keeps Nixpacks' auto-detected Node packages and
# adds chromium on top; the app resolves it via PATH (`command -v chromium`) at
# runtime. Nix's chromium bundles its own libraries, avoiding missing-.so errors.
[phases.setup]
# chromium → PDF rendering; ffmpeg → audio compression + video stickers;
# yt-dlp → media downloads. "..." keeps the auto-detected Node toolchain.
nixPkgs = ["...", "chromium", "ffmpeg", "yt-dlp"]

[variables]
# playwright-core uses the system Chromium above — never download a browser.
PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
